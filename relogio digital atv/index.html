<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="center">
        <!-- Cabeçalho -->
        <div class="header">
            <span class="icone-header">🕒</span>
            <h1>PAINEL DIGITAL</h1>
        </div>

        <!-- Relógio Principal -->
        <div class="caixa relogio-unico">
            <span id="hours">00</span>
            <span class="separador">:</span>
            <span id="minutes">00</span>
            <span class="separador">:</span>
            <span id="seconds">00</span>
        </div>

        <!-- Data Formatada (Ex: 10/09/2026) -->
        <div class="data-resumo">
            <span id="data-completa">00/00/0000</span>
        </div>

        <!-- Caixas da Data (Dia, Mês e Ano) -->
        <div class="caixa data-unica">
            <div class="item-data">
                <span class="label">DIA</span>
                <span id="dias" class="numero">00</span>
            </div>
            <div class="item-data">
                <span class="label">MÊS</span>
                <span id="mes" class="numero">00</span>
            </div>
            <div class="item-data">
                <span class="label">ANO</span>
                <span id="ano" class="numero">0000</span>
            </div>
        </div>

        <!-- Período do Dia (Saudação) -->
        <div class="caixa-periodo">
            <span id="icone-periodo">☀️</span>
            <span id="mensagem-periodo">BOA TARDE!</span>
        </div>

        <!-- Desafio Extra: Status -->
        <div class="status-footer">
            <span class="ponto-verde"></span>
            <span>PAINEL ATUALIZADO AUTOMATICAMENTE</span>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
